<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система оповіщення укриття</title>
    <style>
        :root { color-scheme: dark; font-family: system-ui, sans-serif; }
        body { margin: 0; min-height: 100vh; padding: 16px; box-sizing: border-box; display: flex; justify-content: center; background: #121212; color: #fff; }
        .card { width: 100%; max-width: 520px; height: fit-content; margin-top: 10px; padding: 20px; border-radius: 12px; background: #1e1e1e; box-shadow: 0 4px 15px #0008; text-align: center; }
        button, input { width: 100%; box-sizing: border-box; margin-top: 10px; padding: 13px; border: 0; border-radius: 8px; font-size: 16px; }
        button { background: #007bff; color: white; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: .55; cursor: wait; }
        input { border: 1px solid #444; background: #2a2a2a; color: #fff; }
        .status { color: #aaa; font-size: 14px; }
        .role-btn { background: #28a745; margin-bottom: 4px; }
        .role-btn-student { background: #17a2b8; }
        .btn-stop, .btn-mute-sm { background: #d9534f; }
        .btn-mute-all { background: #ff9800; }
        .btn-unmute-sm { background: #28a745; }
        .mic-toggle-btn { height: 72px; border-radius: 36px; background: #d9534f; }
        .mic-toggle-btn.active { background: #28a745; }
        .students-box { margin-top: 15px; padding: 12px; border-radius: 8px; background: #252525; text-align: left; }
        .students-box h4 { margin: 0 0 8px; color: #4caf50; }
        .students-box ul { margin: 0; padding: 0; list-style: none; }
        .students-box li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid #333; }
        .students-box li span { overflow-wrap: anywhere; }
        .students-box li button { width: auto; margin: 0; padding: 7px 10px; font-size: 13px; white-space: nowrap; }
        #screenContainer { display: none; margin-top: 15px; padding: 8px; border: 1px solid #444; border-radius: 8px; background: #252525; }
        #teacherScreenImg { display: block; width: 100%; height: auto; background: #000; }
    </style>
</head>
<body>
    <main class="card">
        <h2 id="title">Система оповіщення укриття</h2>
        <div id="content">
            <p class="status">Оберіть вашу роль для входу:</p>
            <button class="role-btn" id="teacherRole">👨‍🏫 Я Вчитель</button>
            <button class="role-btn role-btn-student" id="studentRole">🎒 Я Учень</button>
        </div>
    </main>
    <script>
        const titleEl = document.getElementById("title");
        const contentEl = document.getElementById("content");
        const AUDIO_SAMPLE_RATE = 48000;
        const AUDIO_PACKET = 1;
        const SCREEN_PACKET = 2;
        let ws = null;
        let myRole = "";
        let myName = "";
        let isMutedByTeacher = false;
        let micStream = null;
        let micCapture = null;
        let screenStream = null;
        let screenCapture = null;
        let screenInterval = null;
        let audioPlayCtx = null;
        let audioPlaybackNode = null;
        let currentScreenUrl = null;
        const screenFrameUrls = new Set();
        const credentialStorageKeys = {
            teacher: "shelter-teacher-code",
            student: "shelter-room-code"
        };
        let pendingCredential = null;

        document.getElementById("teacherRole").addEventListener("click", showTeacherLogin);
        document.getElementById("studentRole").addEventListener("click", showStudentLogin);

        function showTeacherLogin() {
            titleEl.textContent = "Вхід учителя";
            contentEl.innerHTML = `
                <p class="status">Введіть код учителя:</p>
                <input type="password" id="teacherCode" placeholder="Код учителя" autocomplete="current-password">
                <label style="display:flex;align-items:center;gap:8px;margin-top:10px;text-align:left;color:#aaa;font-size:14px">
                    <input type="checkbox" id="rememberTeacherCode" style="width:auto;margin:0">
                    Запам’ятати код на цьому пристрої
                </label>
                <p class="status">Код зберігається в браузері без шифрування. Не вмикайте на спільному пристрої.</p>
                <button id="teacherLogin" class="role-btn">Підключитися</button>
                <p id="error" class="status" role="alert"></p>`;
            restoreCredential("teacher", "teacherCode", "rememberTeacherCode");
            document.getElementById("teacherLogin").addEventListener("click", () => {
                const code = document.getElementById("teacherCode").value;
                connect("teacher", "Вчитель", code);
            });
        }

        function showStudentLogin() {
            titleEl.textContent = "Вхід учня";
            contentEl.innerHTML = `
                <p class="status">Введіть дані для підключення до класу:</p>
                <input type="text" id="studentName" placeholder="Ваше ім'я та прізвище" maxlength="60" autocomplete="name">
                <input type="password" id="roomCode" placeholder="Код доступу" autocomplete="current-password">
                <label style="display:flex;align-items:center;gap:8px;margin-top:10px;text-align:left;color:#aaa;font-size:14px">
                    <input type="checkbox" id="rememberRoomCode" style="width:auto;margin:0">
                    Запам’ятати код на цьому пристрої
                </label>
                <p class="status">Код зберігається в браузері без шифрування. Не вмикайте на спільному пристрої.</p>
                <button id="studentLogin" class="role-btn">Увійти в укриття</button>
                <p id="error" class="status" role="alert"></p>`;
            restoreCredential("student", "roomCode", "rememberRoomCode");
            document.getElementById("studentLogin").addEventListener("click", () => {
                const name = document.getElementById("studentName").value.trim();
                if (!name) {
                    showError("Введіть своє ім'я.");
                    return;
                }
                connect("student", name, document.getElementById("roomCode").value);
            });
        }

        function restoreCredential(role, inputId, checkboxId) {
            try {
                const credential = window.localStorage.getItem(credentialStorageKeys[role]);
                if (credential !== null) {
                    document.getElementById(inputId).value = credential;
                    document.getElementById(checkboxId).checked = true;
                }
            } catch (error) {
                console.error("Не вдалося прочитати збережений код:", error);
                showError("Браузер не дозволив прочитати збережений код.");
            }
        }

        function storeCredential(role, credential, shouldRemember) {
            try {
                if (shouldRemember) {
                    window.localStorage.setItem(credentialStorageKeys[role], credential);
                } else {
                    window.localStorage.removeItem(credentialStorageKeys[role]);
                }
            } catch (error) {
                console.error("Не вдалося зберегти код у браузері:", error);
                const statusEl = document.getElementById("connStatus");
                if (statusEl) {
                    statusEl.textContent = "Статус: онлайн ✅ Код не збережено в браузері.";
                } else {
                    showError("Не вдалося зберегти код у браузері.");
                }
            }
        }

        function showError(message) {
            const errorEl = document.getElementById("error");
            if (errorEl) errorEl.textContent = message;
        }

        async function connect(role, name, credential) {
            const button = document.getElementById(role === "teacher" ? "teacherLogin" : "studentLogin");
            button.disabled = true;
            myRole = role;
            myName = name;
            const checkboxId = role === "teacher" ? "rememberTeacherCode" : "rememberRoomCode";
            pendingCredential = {
                role,
                credential,
                shouldRemember: document.getElementById(checkboxId).checked
            };
            try {
                await initAudioPlayback();
                const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
                ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
                ws.binaryType = "arraybuffer";
                ws.onopen = () => {
                    ws.send(JSON.stringify({ type: "join", role, name, credential }));
                    credential = "";
                };
                ws.onmessage = handleMessage;
                ws.onclose = () => {
                    pendingCredential = null;
                    const statusEl = document.getElementById("connStatus");
                    if (statusEl) statusEl.textContent = "Статус: з'єднання втрачено";
                    const loginButton = document.getElementById(role === "teacher" ? "teacherLogin" : "studentLogin");
                    if (loginButton) loginButton.disabled = false;
                    stopMicrophone();
                    stopScreenShare(false);
                };
                ws.onerror = () => showError("Не вдалося підключитися до сервера.");
            } catch (error) {
                pendingCredential = null;
                console.error("Помилка підключення:", error);
                showError(error.message || "Не вдалося ініціалізувати аудіо.");
                button.disabled = false;
            }
        }

        async function initAudioPlayback() {
            if (audioPlayCtx) {
                if (audioPlayCtx.state === "suspended") await audioPlayCtx.resume();
                return;
            }
            audioPlayCtx = new AudioContext({ sampleRate: AUDIO_SAMPLE_RATE });
            if (audioPlayCtx.sampleRate !== AUDIO_SAMPLE_RATE) {
                await audioPlayCtx.close();
                audioPlayCtx = null;
                throw new Error("Браузер не підтримує частоту аудіо 48 кГц.");
            }
            await audioPlayCtx.audioWorklet.addModule(new URL("audio-worklet.js", window.location.href));
            audioPlaybackNode = new AudioWorkletNode(audioPlayCtx, "pcm-playback", {
                numberOfInputs: 0,
                numberOfOutputs: 1,
                outputChannelCount: [1]
            });
            audioPlaybackNode.connect(audioPlayCtx.destination);
            if (audioPlayCtx.state === "suspended") await audioPlayCtx.resume();
        }

        function handleMessage(event) {
            if (typeof event.data === "string") {
                let data;
                try {
                    data = JSON.parse(event.data);
                } catch (error) {
                    console.error("Некоректна відповідь сервера:", error);
                    return;
                }
                if (data.type === "auth_error") {
                    pendingCredential = null;
                    showError(data.message);
                    if (ws) ws.close();
                } else if (data.type === "joined") {
                    isMutedByTeacher = data.muted;
                    if (myRole === "teacher") renderTeacherView();
                    else renderStudentView();
                    if (pendingCredential && pendingCredential.role === myRole) {
                        storeCredential(
                            pendingCredential.role,
                            pendingCredential.credential,
                            pendingCredential.shouldRemember
                        );
                        pendingCredential = null;
                    }
                } else if (data.type === "students_list" && myRole === "teacher") {
                    updateStudentsUI(data.students);
                } else if (data.type === "you_are_muted" && myRole === "student") {
                    isMutedByTeacher = data.muted;
                    if (isMutedByTeacher) stopMicrophone();
                    updateMicButton();
                    const statusText = document.getElementById("micStatusText");
                    if (statusText) statusText.textContent = isMutedByTeacher
                        ? "🔇 Вас замутив учитель"
                        : "Натисніть, щоб говорити з учителем:";
                } else if (data.type === "stop_screen" && myRole === "student") {
                    clearScreenFrame();
                }
                return;
            }
            if (event.data instanceof ArrayBuffer) handleBinaryMessage(event.data);
        }

        function renderTeacherView() {
            titleEl.textContent = "Панель учителя";
            contentEl.innerHTML = `
                <p class="status" id="connStatus">Статус: онлайн ✅</p>
                <section class="students-box">
                    <h4 id="studentsTitle">👥 Учні в укритті (0):</h4>
                    <button class="btn-mute-all" id="muteAll">🔇 Замутити всіх</button>
                    <button class="btn-unmute-sm" id="unmuteAll">🔊 Розмутити всіх</button>
                    <ul id="studentsList"><li>Очікування підключень...</li></ul>
                </section>
                <div style="margin-top:15px;border-top:1px solid #444;padding-top:15px">
                    <button id="btnStartScreen">🖥️ Почати трансляцію екрана</button>
                    <button id="btnStopScreen" class="btn-stop" hidden>⏹ Зупинити трансляцію</button>
                </div>
                <button class="mic-toggle-btn" id="micBtn">🎙 Увімкнути мікрофон</button>`;
            document.getElementById("muteAll").addEventListener("click", () => sendCommand("mute_all"));
            document.getElementById("unmuteAll").addEventListener("click", () => sendCommand("unmute_all"));
            document.getElementById("btnStartScreen").addEventListener("click", startScreenShare);
            document.getElementById("btnStopScreen").addEventListener("click", () => stopScreenShare(true));
            document.getElementById("micBtn").addEventListener("click", toggleMicrophone);
        }

        function renderStudentView() {
            titleEl.textContent = `Учень: ${myName}`;
            contentEl.innerHTML = `
                <p class="status" id="connStatus">Статус: онлайн ✅</p>
                <p class="status" id="micStatusText">Натисніть, щоб говорити з учителем:</p>
                <button class="mic-toggle-btn" id="micBtn">🎙 Увімкнути мікрофон</button>
                <section id="screenContainer">
                    <h4 style="margin:0 0 6px;color:#4caf50">🖥 Екран учителя:</h4>
                    <img id="teacherScreenImg" alt="Очікування трансляції" />
                </section>`;
            document.getElementById("micBtn").addEventListener("click", toggleMicrophone);
            updateMicButton();
        }

        function updateStudentsUI(students) {
            const list = document.getElementById("studentsList");
            if (!list) return;
            document.getElementById("studentsTitle").textContent = `👥 Учні в укритті (${students.length}):`;
            list.replaceChildren();
            if (students.length === 0) {
                const empty = document.createElement("li");
                empty.textContent = "Нікого немає у сховищі";
                list.append(empty);
                return;
            }
            for (const student of students) {
                const item = document.createElement("li");
                const label = document.createElement("span");
                label.textContent = `${student.muted ? "🔴" : "🟢"} ${student.name}`;
                const button = document.createElement("button");
                button.className = student.muted ? "btn-unmute-sm" : "btn-mute-sm";
                button.textContent = student.muted ? "Розмутити" : "Замутити";
                button.addEventListener("click", () => sendCommand("set_student_mute", {
                    id: student.id,
                    muted: !student.muted
                }));
                item.append(label, button);
                list.append(item);
            }
        }

        function sendCommand(type, values = {}) {
            if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type, ...values }));
        }

        function handleBinaryMessage(buffer) {
            const packet = new Uint8Array(buffer);
            if (packet.length < 1) return;
            if (packet[0] === SCREEN_PACKET && myRole === "student") {
                const container = document.getElementById("screenContainer");
                const img = document.getElementById("teacherScreenImg");
                if (!container || !img || packet.length < 2) return;
                currentScreenUrl = URL.createObjectURL(new Blob([packet.subarray(1)], { type: "image/jpeg" }));
                screenFrameUrls.add(currentScreenUrl);
                img.onload = () => {
                    for (const url of screenFrameUrls) {
                        if (url !== currentScreenUrl) {
                            URL.revokeObjectURL(url);
                            screenFrameUrls.delete(url);
                        }
                    }
                    img.onload = null;
                };
                img.src = currentScreenUrl;
                container.style.display = "block";
                return;
            }
            if (packet[0] !== AUDIO_PACKET || packet.length < 20 || !audioPlaybackNode) return;
            const id = Array.from(packet.subarray(1, 17), byte => byte.toString(16).padStart(2, "0")).join("");
            const streamKind = packet[17];
            const samples = buffer.slice(18);
            audioPlaybackNode.port.postMessage({
                streamId: `${id}:${streamKind}`,
                samples
            }, [samples]);
        }

        function clearScreenFrame() {
            const container = document.getElementById("screenContainer");
            const img = document.getElementById("teacherScreenImg");
            if (img) {
                img.removeAttribute("src");
                img.onload = null;
            }
            for (const url of screenFrameUrls) URL.revokeObjectURL(url);
            screenFrameUrls.clear();
            currentScreenUrl = null;
            if (container) container.style.display = "none";
        }

        function updateMicButton() {
            const button = document.getElementById("micBtn");
            if (!button) return;
            button.disabled = myRole === "student" && isMutedByTeacher;
            button.classList.toggle("active", !!micCapture);
            button.textContent = isMutedByTeacher && myRole === "student"
                ? "🔇 Заблоковано вчителем"
                : micCapture ? "🔴 Вимкнути мікрофон" : "🎙 Увімкнути мікрофон";
        }

        async function createCapture(stream, kind) {
            const context = new AudioContext({ sampleRate: AUDIO_SAMPLE_RATE });
            if (context.sampleRate !== AUDIO_SAMPLE_RATE) {
                await context.close();
                throw new Error("Браузер не підтримує частоту аудіо 48 кГц.");
            }
            await context.audioWorklet.addModule(new URL("audio-worklet.js", window.location.href));
            const source = context.createMediaStreamSource(stream);
            const node = new AudioWorkletNode(context, "pcm-capture", {
                numberOfInputs: 1,
                numberOfOutputs: 1,
                outputChannelCount: [1]
            });
            node.port.onmessage = ({ data }) => {
                if (!ws || ws.readyState !== WebSocket.OPEN ||
                    (myRole === "student" && (isMutedByTeacher || kind !== 0)) ||
                    ws.bufferedAmount > 128 * 1024) return;
                const samples = new Uint8Array(data);
                const packet = new Uint8Array(samples.length + 2);
                packet[0] = AUDIO_PACKET;
                packet[1] = kind;
                packet.set(samples, 2);
                ws.send(packet);
            };
            source.connect(node);
            node.connect(context.destination);
            return { context, source, node };
        }

        async function toggleMicrophone() {
            if (myRole === "student" && isMutedByTeacher) return;
            if (micCapture) {
                stopMicrophone();
                return;
            }
            const button = document.getElementById("micBtn");
            if (button) button.disabled = true;
            try {
                await initAudioPlayback();
                if (audioPlayCtx.state === "suspended") await audioPlayCtx.resume();
                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });
                micCapture = await createCapture(micStream, 0);
                updateMicButton();
            } catch (error) {
                console.error("Помилка мікрофона:", error);
                if (micStream) micStream.getTracks().forEach(track => track.stop());
                micStream = null;
                micCapture = null;
                updateMicButton();
                alert(error.message || "Не вдалося отримати доступ до мікрофона.");
            }
        }

        function stopCapture(capture) {
            if (!capture) return;
            capture.node.port.onmessage = null;
            capture.source.disconnect();
            capture.node.disconnect();
            capture.context.close().catch(error => console.error("Помилка закриття аудіо:", error));
        }

        function stopMicrophone() {
            stopCapture(micCapture);
            micCapture = null;
            if (micStream) micStream.getTracks().forEach(track => track.stop());
            micStream = null;
            updateMicButton();
        }

        async function startScreenShare() {
            const startButton = document.getElementById("btnStartScreen");
            if (startButton) startButton.disabled = true;
            try {
                screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                const video = document.createElement("video");
                video.muted = true;
                video.srcObject = screenStream;
                await video.play();

                const audioTracks = screenStream.getAudioTracks();
                if (audioTracks.length) screenCapture = await createCapture(new MediaStream(audioTracks), 1);
                const canvas = document.createElement("canvas");
                const context = canvas.getContext("2d");
                let sending = false;
                screenInterval = setInterval(() => {
                    if (!ws || ws.readyState !== WebSocket.OPEN || ws.bufferedAmount > 1024 * 1024 ||
                        sending || !video.videoWidth || !video.videoHeight) return;
                    const width = Math.min(1280, video.videoWidth);
                    const scale = width / video.videoWidth;
                    canvas.width = width;
                    canvas.height = Math.round(video.videoHeight * scale);
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    sending = true;
                    canvas.toBlob(async blob => {
                        try {
                            if (!blob || !ws || ws.readyState !== WebSocket.OPEN ||
                                ws.bufferedAmount > 1024 * 1024) return;
                            const frame = new Uint8Array(await blob.arrayBuffer());
                            const packet = new Uint8Array(frame.length + 1);
                            packet[0] = SCREEN_PACKET;
                            packet.set(frame, 1);
                            ws.send(packet);
                        } catch (error) {
                            console.error("Помилка кодування кадру:", error);
                        } finally {
                            sending = false;
                        }
                    }, "image/jpeg", 0.55);
                }, 1000 / 6);

                const videoTrack = screenStream.getVideoTracks()[0];
                videoTrack.addEventListener("ended", () => stopScreenShare(true), { once: true });
                if (startButton) startButton.hidden = true;
                const stopButton = document.getElementById("btnStopScreen");
                if (stopButton) stopButton.hidden = false;
            } catch (error) {
                console.error("Не вдалося почати трансляцію екрана:", error);
                stopScreenShare(true);
                alert(error.message || "Не вдалося почати трансляцію екрана.");
            } finally {
                if (startButton && !screenStream) startButton.disabled = false;
            }
        }

        function stopScreenShare(notifyServer) {
            if (screenInterval !== null) clearInterval(screenInterval);
            screenInterval = null;
            stopCapture(screenCapture);
            screenCapture = null;
            if (screenStream) screenStream.getTracks().forEach(track => track.stop());
            screenStream = null;
            const startButton = document.getElementById("btnStartScreen");
            const stopButton = document.getElementById("btnStopScreen");
            if (startButton) {
                startButton.hidden = false;
                startButton.disabled = false;
            }
            if (stopButton) stopButton.hidden = true;
            if (notifyServer) sendCommand("stop_screen");
        }
    </script>
</body>
</html>
